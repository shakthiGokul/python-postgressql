[project]
name = "python-neon-postgres"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic[email]>=2.14.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "server"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E/F: errors and unused code, I: import sorting, UP: modern Python syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
